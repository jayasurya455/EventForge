<app-shell>
    <app-top-nav></app-top-nav>
    <div class="page-container">
        <div class="ef-card player-form-card">

            <!-- Header -->
            <div class="form-header flex items-center gap-4 mb-4">
                <div
                    class="w-12 h-12 rounded-full flex items-center justify-center bg-gradient-to-br from-blue-500 to-indigo-300">
                    <app-icon name="person"></app-icon>
                </div>

                <div>
                    <h2 class="text-lg font-semibold">{{ mode === 'create' ? 'Add New Player' : 'Edit Player' }}</h2>
                    <p class="text-sm text-[var(--text-muted)]">Register a Player for the auction pool</p>
                </div>
            </div>

            <!-- Logo -->
            <form-logo [urlPath]="logoPath" [logobase64]="playerImage" (logoSelectedPath)="updateLogoPath($event)"></form-logo>

            <!-- Fields -->
            <div class="form-grid">

                <div class="field-row">
                    <label>Name</label>
                    <input type="text" class="field-input" placeholder="e.g. Virat Kohli" [(ngModel)]="playerName" />
                </div>

                <div class="field-row">
                    <label>Email</label>
                    <input type="text" class="field-input" placeholder="e.g. abc@mail.com" [(ngModel)]="playerEmail"/>
                </div>

                <div class="field-row">
                    <label>Area</label>
                    <input type="text" class="field-input" placeholder="e.g. India" [(ngModel)]="playerArea"/>
                </div>

                <div class="field-row">
                    <label>Base Price</label>
                    <input type="number" class="field-input" placeholder="200000" [(ngModel)]="playerPrice"/>
                </div>

            </div>

            <!-- Role -->
            <div class="role-section">
                <label>Role</label>

                <div class="pill-group">
                    <button *ngFor="let role of roles" class="pill" [class.active]="selectedRole === role"
                        (click)="selectRole(role)">
                        {{ role }}
                    </button>
                </div>
            </div>

            <!-- Footer -->
            <div class="form-footer">
                <app-button variant="primary" color="blue" (clickTriggered)="callPlayer()">
                    {{ mode === 'create' ? 'Add Player' : 'Save Changes' }}
                </app-button>

                <app-button variant="outline" (clickTriggered)="cancel()">
                    <span class="w-full text-center">Cancel</span>
                </app-button>
            </div>

        </div>
    </div>

</app-shell>
