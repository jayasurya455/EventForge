<div>
    <label class="block text-xs font-medium uppercase tracking-wide
               text-[var(--text-muted)] mb-2">
        {{ label }}
    </label>

    <div class="relative">
        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
            <app-icon name="search" size="sm"></app-icon>
        </div>

        <input type="text" [placeholder]="placeholder" (input)="onInput($event)" class="w-full rounded-xl
                 bg-[var(--surface-3)]
                 border border-[var(--border)]
                 pl-11 pr-4 py-3
                 text-sm
                 placeholder:text-[var(--text-muted)]
                 focus:outline-none focus:ring-0">
    </div>
</div>
