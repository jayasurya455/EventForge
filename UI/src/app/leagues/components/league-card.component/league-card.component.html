<div class="ef-card w-full relative overflow-visible" [class.selected]="isSelected">

  <div class="absolute top-6 right-6" (click)="$event.stopPropagation()">
    <button class="cursor-pointer rounded-lg transition-all relative z-10" (click)="toggleMenu()">
      <app-icon name="more" size="sm"></app-icon>
    </button>
    <div *ngIf="menuOpen"
      class="menu-more absolute right-0 top-full w-48 bg-[var(--app-bg)] border border-[var(--border)]/10 rounded-xl shadow-2xl z-50 overflow-hidden backdrop-blur-xl">
      <div class="p-1.5">
        <button (click)="router.navigate(['leagues', leagueDetails?.id, 'edit'])"
          class="cursor-pointer w-full flex items-center gap-3 px-3 py-2 text-sm hover:bg-[var(--surface-hover)] hover:text-[var(--text-primary)] rounded-lg transition-colors text-left group/item">
          <app-icon name="edit" size="sm"></app-icon>
          <span>Edit</span>
        </button>
        <button (click)="showDeleteConfirm = true"
          class="cursor-pointer w-full flex items-center gap-3 px-3 py-2 text-sm text-red-400 hover:bg-red-500/10 rounded-lg transition-colors text-left group/item">
          <app-icon name="delete" size="sm" class="text-red-400/70 group-hover/item:text-red-400"></app-icon>
          <span>Delete</span>
        </button>
      </div>
    </div>
  </div>

  <!-- Header -->
  <div class="flex items-center gap-4 mb-4">
    <div class="w-12 h-12 rounded-full flex items-center justify-center
             bg-gradient-to-br from-purple-500 to-pink-500">
      <app-icon [name]="leagueDetails?.logoImage ? 'custom' : 'trophy'"
        [imageLogo]="leagueDetails?.logoImage"></app-icon>
    </div>

    <div>
      <h3 class="text-lg font-semibold">{{ title }}</h3>
      <p class="text-sm text-[var(--text-muted)]">{{ subtitle }}</p>
    </div>
  </div>

  <!-- Stats -->
  <div class="grid grid-cols-2 gap-4 mb-4">
    <app-stat-card icon="groups" label="Maximum Teams" [value]="teams + ' Teams'" [compact]="true"></app-stat-card>

    <app-stat-card icon="person" label="Maximum Players" [value]="players + ' Players'"
      [compact]="true"></app-stat-card>
  </div>

  <!-- Actions -->
  <div class="grid grid-cols-2 gap-3 pt-4 border-t border-[var(--border)]">

    <app-button *ngIf="status === 'LIVE'" variant="primary" (clickTriggered)="startAuction()">
      <app-icon name="play" size="sm"></app-icon>
      Start Auction
    </app-button>

    <app-button variant="outline" (clickTriggered)="viewAuctions()">
      <app-icon name="info" size="sm"></app-icon>
      View Details
    </app-button>

  </div>
</div>

<app-confirm-dialog *ngIf="showDeleteConfirm" title="Are you sure you want to delete this league?"
  message="This action cannot be undone and all associated data will be permanently removed." confirmText="Yes, Delete"
  cancelText="No, Cancel" (confirm)="confirmDelete()" (cancel)="showDeleteConfirm = false">
</app-confirm-dialog>
