<div class="ef-card relative w-full" [class.selected]="isSelectedTeam" (click)="selectable && onSelectionChange()">

    <div *ngIf="selectable" class="absolute top-4 right-4">
        <input type="checkbox" class="ef-checkbox" [checked]="isSelectedTeam" (change)="onSelectionChange()" (click)="$event.stopPropagation()" />
    </div>

    <!-- Header -->
    <div class="flex items-center gap-4 mb-6">

        <ng-container *ngIf="team.logoImage; else initialsLogo">
            <div class="w-12 h-12 rounded-full flex items-center justify-center
             bg-gradient-to-br from-purple-500 to-pink-500">
                <app-icon [name]="team.logoImage ? 'custom' : 'trophy'" [imageLogo]="team.logoImage"></app-icon>
            </div>
        </ng-container>

        <div class="flex-1">
            <h3 class="text-lg font-semibold leading-tight">
                {{ team.shortName }}
            </h3>
            <p class="text-sm text-[var(--text-muted)]">
                {{ team.name }}
            </p>
        </div>
    </div>

    <!-- Stats -->
    <div class="space-y-3 mb-6 text-sm">
        <div class="flex justify-between">
            <span class="text-[var(--text-muted)]">Total Budget Provided By Team</span>
            <span class="font-medium">{{ team.teamProvidedbudget }}</span>
        </div>

        <!-- <div class="flex justify-between">
            <span class="text-[var(--text-muted)]">Remaining</span>
            <span class="font-medium text-emerald-500">
                {{ team.remaining }}
            </span>
        </div>

        <div class="flex justify-between">
            <span class="text-[var(--text-muted)]">Players</span>
            <span class="font-medium">{{ team.players }}</span>
        </div> -->
    </div>

    <!-- Budget Progress -->
    <!-- <div class="mb-6">
        <div class="flex justify-between text-xs mb-1 text-[var(--text-muted)]">
            <span>Budget Used</span>
            <span>{{ team.used }}%</span>
        </div>

        <div class="h-2 rounded-full bg-[var(--surface-3)] overflow-hidden">
            <div class="h-full transition-all" [style.width.%]="team.used" [style.background]="team.teamColor">
            </div>
        </div>
    </div> -->

    <!-- Actions -->
    <div *ngIf="!readOnly" class="flex gap-3 pt-4 border-t border-[var(--border)]">
        <app-button variant="primary" color="green" class="flex-1" [routerLink]="['/teams', team.id, 'edit']">
            <app-icon name="edit" size="sm"></app-icon>
            Edit
        </app-button>

        <app-button variant="outline" color="red" (clickTriggered)="showDeleteConfirm = true">
            <app-icon name="delete" size="sm"></app-icon>
        </app-button>
    </div>
</div>

<ng-template #initialsLogo>
    <div class="w-12 h-12 rounded-full flex items-center justify-center " [style.background]="team.teamColor">
        <span class="text-white font-semibold text-lg">
            {{ team.teamInitial }}
        </span>
    </div>
</ng-template>

<app-confirm-dialog *ngIf="showDeleteConfirm" title="Are you sure you want to delete this team?"
    message="This action cannot be undone and all associated data will be permanently removed."
    confirmText="Yes, Delete" cancelText="No, Cancel" (confirm)="confirmDelete()" (cancel)="showDeleteConfirm = false">
</app-confirm-dialog>
